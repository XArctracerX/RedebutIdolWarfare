#### Events #### 
### Phase One ###
FAU_phase_one.1.t:0 "World Tree Planted"
FAU_phase_one.1.d:0 "Ceres Fauna, Keeper of Nature, greeted thousands of her fans in Kirin today as she announced the official planting ceremony of the World Tree. This event marked a new era in the eyes of Saplings all over the world. Many have pledged their utmost allegiance to Mother Nature, vowing to restore Earth to its former glory. Fauna has repeatedly expressed her dismay with environmental pollution and the World Tree is in her words, the first step to healing the destruction that humanity caused. It is expected that the World Tree will grow over time to be taller than any manmade structure."
FAU_phase_one.1.a:0 "Can’t hate on that."

FAU_phase_one.2.t:0 "Mother Nature Plays Favorites"
FAU_phase_one.2.d:0 "Today at 13:00 local time, Fauna was seen outside a high-rise complex next to a large cube covered by a black sheet. As a crane lifted the sheet off the cube, sounds of disgust were heard through the crowd and Fauna covered her mouth as if to vomit. What was revealed was a glass box full to the brim with cockroaches and grasshoppers. After taking a while to slow her heart rate, Fauna announced to onlookers that this would be the first example made in regards to the new extermination laws. Towards the end of her declaration of war against cockroaches and grasshoppers, flames appeared under the cube and Fauna laughed maniacally while the insects scrambled in desperation. Her laughing was cut short as she winced and squirmed at the disgusting noises of insects jumping against glass."
FAU_phase_one.2.a:0 "Who gave her permission to use fire?"

FAU_phase_one.3.t:0 "Rival to Humanity?"
FAU_phase_one.3.d:0 "After the cockroach and grasshopper extermination protocols, people started sighting a horrifying beast in the forest claiming it looked like a mistake by Mother Nature. Investigations were started to find this beast, only to discover on contact that it was sentient, and the noises it made appeared to resemble some sort of language. Ceres Fauna was intrigued and asked to go on an expedition to see this creature. When Fauna arrived, her face lit up with glee and she started shouting about pickles, or rather the lack thereof. She approached this beast like a mother approaching her son, reaching out a hand. The beast craned its neck, before putting forth its own open palm, their hands making contact. Fauna seemed to understand everything it said and decided to invite it back to civilization.\n\nCurrently at the time of writing, “Not Pickle” as it has been named, has rapidly advanced through military training using its surprising intelligence. We suspect by the time this writing reaches the general public, everyone will be well aware of the new Field Marshal."
FAU_phase_one.3.a:0 "Cockroaches and grasshoppers aren’t ok, but this is?"

FAU_phase_one.4.t:0 "Wildfires Caused by Ceres Fauna"
FAU_phase_one.4.d:0 "After a bizarre accident where Ceres Fauna set fire to an entire forest, she has made a vow to never play with fire again. Many citizens were affected by this wildfire and still hold doubts that she won't do the same again. Measures have been taken to ensure that Fauna won't get her hands on any fire starting devices without supervision. Saplings have had mixed reactions towards this, some thinking it's deserved, while others are outspoken about a lack of trust being shown towards their very own Keeper of Nature. Either way, Fauna is working hard to prevent future incidents such as this from happening again."
FAU_phase_one.4.a:0 "Wildfires are “technically” natural..."

FAU_phase_one.5.t:0 "Letter from a Friend"
FAU_phase_one.5.d:0 "Dearest Faunya,\n\nWhat news I’ve heard, a grand debut. My companion, you’ve come so far from the days we spent sniping hagravens and battling spriggans. Now, you run a country so bountiful with life. I don’t know how I got here, but I came to be in a country known as “Wilderwood Forest” where I honed a new life and stabilised myself. As I learned of this new world I now lived in, I dared not believe my ears when I heard about your situation. By the time this letter reaches you, I will be in your country, having travelled across a place locals have called the Eurasian Steppe. I will stay in a place called “Urumqi” near the northwestern border.\n\nI hope you welcome me into your fold once more.\n\nRegards, Faendal."
FAU_phase_one.5.a:0 "Of course you’re welcome, Dear Friend."

FAU_phase_one.6.t:0 "FaunaMart Established"
FAU_phase_one.6.d:0 "This evening, Ceres Fauna has announced that the economy needs “rejigging” with a “money making scheme”. She formally presented her idea of a new conglomerate funded by the government called “FaunaMart”. The premise was laid out plainly: “Buy low, sell high”. FaunaMart will use its profits to fund local libraries, while also directly feeding into the economy and government institutions. You can expect to see Faunamarts appear in your local areas in the upcoming weeks. Worries have emerged that FaunaMart may outcompete small, local businesses, but she claims it is “survival of the fittest”.\n\nHere at FauNews, we can only say that Mother Nature knows best."
FAU_phase_one.6.a:0 "In this economy?"

FAU_phase_one.7.t:0 "Lottery Announced at FaunaMart"
FAU_phase_one.7.d:0 "Following the success of FaunaMart, Fauna has announced the availability of FaunaMart lottery tickets at all good FaunaMart stores. These tickets will be available at low prices and able to be bought in bulk. Drawings will occur everyday at 5 pm PT, 8 pm ET, and 9 am JST. Prizes are yet to be announced, but shoppers can expect a large jackpot. She was adamant that it is not a scam and that if it was, she would investigate herself for wrongdoings. Ceres Fauna has yet to announce where any of the profits will go, which has been met with scrutiny by the general public."
FAU_phase_one.7.a:0 "Count me in!"
FAU_phase_one.7.b:0 "Truth is, the game was rigged from the start."
FAU_phase_one.7.c:0 "This is a scam."

FAU_phase_one.8.t:0 "Born Again, Bald"
FAU_phase_one.8.d:0 "Gasps were heard as Ceres Fauna descended the mountain steps, for there were not two suns, but one sun and a shiny, bald head. “No hair will get in my way”, she declared to the crowd. Her gown flowed in the wind as if it were making a mockery of what used to flow on her head. The crowd parted in two as she moved with purpose. She was unfazed by the comments about her slappable head or the fact that her antlers now looked like mutated growths instead of the majesty they once radiated. Regardless of how witnesses reacted, she was now Bald Fauna, and all would tremble beneath her smooth, shaven scalp."
FAU_phase_one.8.a:0 "Praise be."

FAU_phase_one.9.t:0 "Establishment of FFF"
FAU_phase_one.9.d:0 "She laughed. She made a fish farm and she laughed. She observed with binoculars their movements. Modeled after PPP (Previously Pekora’s Property), which itself was inspired by TTT (Tenkuu Trap Tower), FFF (Funny Fish Farm) is Ceres Fauna’s ingenious new breeding farm for specially evolved fish. Freaks of nature they may be, they have the exact traits that we need to improve upon our manmade navy. No longer will our ships be propelled by noisy, polluting engines, but by living beings. This was why Fauna was laughing. These fish were being bred for such an absurd, yet wondrous purpose. They were not just fish anymore. They were the next step in naval warfare."
FAU_phase_one.9.a:0 "Evolution has gone too far."