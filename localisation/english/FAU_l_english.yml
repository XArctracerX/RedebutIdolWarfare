### Phase One ###
## Opening ##
FAU_let_the_yapping_commence:0 "Let the Yapping Commence"
  FAU_let_the_yapping_commence_desc:0 "Since the very first life appeared on Earth, the Keeper of Nature has been a gentle guide for evolution. She has nurtured every living thing, from single cell organisms to intelligent primates. Through her extensive care, humans stand as the dominant species on Earth, but nature has suffered for it. The Keeper of Nature must step in once more and redirect humans towards the path of harmony before it’s too late."
FAU_world_tree_seed:0 "World Tree Seed"
  FAU_world_tree_seed_desc:0 "Humanity has become so far detached from nature that many don’t know the beauty of it. They need to be shown that beauty, but like all things in nature, it will take time. From every seed, a beautiful plant will bloom, and the World Tree will be no different. One day, it will tower above the clouds, serving as a beacon to humanity’s coexistence with nature."
