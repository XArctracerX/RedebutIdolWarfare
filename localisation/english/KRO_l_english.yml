#### Focus Tree #### 
### Phase One ###
## Opening ##
KRO_the_kroniicopter_has_landed:0 "The Kroniicopter has Landed"
  KRO_the_kroniicopter_has_landed_desc:0 "Currently, we’re faced with many issues. An immigration crisis, those pesky allegations, and a war with the Haachama Order threatening to destroy Australia. In anycase, we must shelter away from Hololive and strengthen ourselves. Our Empironii’s rise will be a beautiful thing to witness."
## Internal Affairs ##
KRO_empironii_internal_affairs:0 "Empironii Internal Affairs"
  KRO_empironii_internal_affairs_desc:0 "The opportunity to organise has arisen. Kronii has sorted thirty chests before, so how hard can a country be? The maid will awaken once more to bring order to this chaotic nation."
# Fox Immigrants Subpath #
KRO_white_fox_immigrants:0 "White fox Immigrants"
  KRO_white_fox_immigrants_desc:0 "Thanks to Mumei’s insistence, we’ve had to allow immigrants from the White Fox Friendom into our country. This carries some benefits, such as being able to enlist them into our military and of course send them into the workforce."
KRO_mumeis_fox_sanctuary:0 "Mumei's fox Sanctuary"
  KRO_mumeis_fox_sanctuary_desc:0 "Mumei has offered to create a refugee sanctuary for White Fox immigrants within our territory. This will help take some of the stress off of our own institutions and means even more potential labor!"
# Continued Affairs #
KRO_address_the_pet_play_allegations:0 "Address the pet Play Allegations"
  KRO_address_the_pet_play_allegations_desc:0 "The Kronies have come up with a bizarre conspiracy that’s spreading like wildfire. It’s time we publicly deny this nonsense. Although, it wouldn’t hurt to have a pair of cat ears handy."
KRO_the_wardens_eating_habits:0 "The Warden's Eating Habits"
  KRO_the_wardens_eating_habits_desc:0 "Recently, Kronii has been a little bit obsessed with a certain restaurant chain that sells sandwiches. It seems a little unhealthy, but surely she isn’t going down a dangerous path. We’ll just have to see what happens."
# Subway Subpath #
KRO_stockpile_sandwiches:0 "Stockpile Sandwiches"
  KRO_stockpile_sandwiches_desc:0 "Some mad, beautiful woman is going around buying all the sandwiches for herself. It looks like Kronii has no choice but to buy them all before this gorgeous stranger does, for national security, of course."
KRO_meatball_marinara:0 "Meatball Marinara"
  KRO_meatball_marinara_desc:0 "Meatballs are in low supply at the moment. It’s a shame, since they’re so delicious. Let’s get those numbers back into the green."
KRO_tuna_sub:0 "Tuna Sub"
  KRO_tuna_sub_desc:0 "What do they mean we ate all the tuna? We’ll build more fishing boats for Kronii’s sake! We can’t just survive on bread! What are we, Sana?"
KRO_steak_and_cheese:0 "Steak and Cheese"
  KRO_steak_and_cheese_desc:0 "The gym has taught Kronii many lessons, one of them being if you want to get strong, you need protein. To help with boosting our army’s strength, a certain sandwich company’s product will be needed."
KRO_liquidize_subways_assets:0 "Liquidize Subway's Assets"
  KRO_liquidize_subways_assets_desc:0 "An insane idea has come to our incredible leader’s mind. Subway sandwiches are great as is, but the drinks aren’t as memorable. Why not turn the sandwiches into drinks? Nothing can go wrong with that!"
# Spicy Noodles Subpath #
KRO_spicy_noodle_challenge:0 "Spicy Noodle Challenge"
  KRO_spicy_noodle_challenge_desc:0 "The public seems to not respect us as much as we’d like. There’s only one logical conclusion to this—show off by eating the spiciest food on the planet."
KRO_that_wasnt_so_bad:0 "That Wasn't so bad"
  KRO_that_wasnt_so_bad_desc:0 "That was it? Kronii laughs in the face of spice. She vows to destroy even more foods that come her way."
KRO_one_chip_challenge:0 "One Chip Challenge"
  KRO_one_chip_challenge_desc:0 "After the last challenge, the great and beautiful Kronii has proven herself to be infallible. However, news of an even spicier opponent has arrived. What say she put this challenger to rest?"
KRO_ban_the_one_chip_challenge:0 "Ban the one Chip Challenge"
  KRO_ban_the_one_chip_challenge_desc:0 "Kronii needs rest. Make sure this chip never sees the light of day. The ingredients however need to be studied."
## Main ##
KRO_bunkeronii_incorporated:0 "Bunkeronii Incorporated"
  KRO_bunkeronii_incorporated_desc:0 "The people are begging for a generous leader for them to work under. Supposedly, we could take advantage of that. Let us have the glorious, magnanimous, and not to mention beautiful Kronii become CEO of a new company."
KRO_expand_bunkeronii:0 "Expand Bunkeronii"
  KRO_expand_bunkeronii_desc:0 "As expected, our new business is growing rapidly. Construction of more factories is needed, but what a magnificent start! Whoever founded this company must be a genius."
KRO_borrow_sapling_labor:0 "Borrow Sapling Labor"
  KRO_borrow_sapling_labor_desc:0 "Although not necessary, perhaps we could grab more able hands from Fauna. She is a friend to Kronii, after all. How could she say no?"
KRO_demand_sapling_mine_profits:0 "Demand Sapling Mine Profits"
  KRO_demand_sapling_mine_profits_desc:0 "The Saplings have been delighted to help. The light in their eyes would make a great lantern for the mines. In fact, there’s an abandoned mine in northern Ontario they could live in. A whole mine just for them! It’s only fair they hand over everything they find in there."
KRO_put_down_piglin_revolt:0 "Put Down Piglin Revolt"
  KRO_put_down_piglin_revolt_desc:0 "Word has reached us that the ex-employees are planning a revolt. Executing them will bring negative press, but it must be done. Perhaps we could get the current employees to carry out the executions."
KRO_appease_bunkeronii_employees:0 "Appease Bunkeronii Employees"
  KRO_appease_bunkeronii_employees_desc:0 "Our employees are not even slightly grateful for the generosity they’ve been shown! They’re threatening to notify Justice of workers rights violations. This is how they treat their benevolent leader? Fine, negotiations will have to be made."
KRO_rapid_promotions:0 "Rapid Promotions"
  KRO_rapid_promotions_desc:0 "To keep the current employees from causing a similar ruckus, we’ll hand out rapid promotions, even to the newer hires. A new word next to their job title doesn't matter. They still work under us."
KRO_hush_money:0 "Hush Money"
  KRO_hush_money_desc:0 "It’s of high priority to approach those with damning stories about Bunkeronii Inc. before Great Exardian or Freesian investigators do. Whatever their demand, we will pay it. We cannot take such a big hit to our image."
KRO_faunas_ultimatum:0 "Faunas Ultimatum"
  KRO_faunas_ultimatum_desc:0 "A letter bearing the seal of a golden apple has been delivered to the Warden. Whatever the Keeper of Nature needs this time, let us hope it’s nothing extreme."
# Foresty Subpath #
KRO_introduce_bunkeronii_berry_farms:0 "Introduce Bunkeronii Berry Farms"
  KRO_introduce_bunkeronii_berry_farms_desc:0 "Why are we giving our workers luxuries such as bread? Those are reserved for loyal Kronies only. It would be much more cheap and efficient to grow workforce food on-site. Besides, who doesn't love fresh berries? Just ask the owl!"
KRO_bunkeronii_lumber:0 "Bunkeronii Lumber"
  KRO_bunkeronii_lumber_desc:0 "The amount of trees that have been cut down for the berry farms can be repurposed back into more buildings. And the more buildings made… the more trees to cut down for more buildings! Kronii is such a genius."
## Faction ##
KRO_the_council:0 "The Council"
  KRO_the_council_desc:0 "Since the beginning of the universe, the Council has always been inseparable. That bond is unshakable. We must do everything in our power to ensure it remains that way."
KRO_open_up_to_trade:0 "Open up to Trade"
  KRO_open_up_to_trade_desc:0 "A proposal has been made to found the “Empironii Trade Company” so that we can fund our industry without being halted by our own resource limitations. Kronii is incredibly charismatic, so striking deals with foreign powers will be no issue whatsoever."
KRO_assist_sanas_tower_construction:0 "Assist Sana's Tower Construction"
  KRO_assist_sanas_tower_construction_desc:0 "Sana is working on an incredibly ambitious project. We would be heartless to ignore her requests for help. Sana has always been as solid as a rock. We cannot refuse!"
KRO_export_flowers_to_the_hoomans:0 "Export Flowers to the Hoomans"
  KRO_export_flowers_to_the_hoomans_desc:0 "Everyone knows that Mumei loves flowers, but no one knows as much as Kronii does. We’ll export our entire supply of flowers to Hooman Civilization. It’s not like we have any use for them during winter anyway."
KRO_import_hooman_berries:0 "Import Hooman Berries"
  KRO_import_hooman_berries_desc:0 "The saying goes “you scratch my back, I scratch yours.” Mumei has taken this to heart and is offering shipments of berries in return for flowers. How... kind of her. We totally need more of those..."
## War Goals ##
KRO_eliminate_false_mother_nature:0 "Eliminate False Mother Nature"
  KRO_eliminate_false_mother_nature_desc:0 "Only one person in this world is allowed the title of “Mother Nature”, and it’s not Haruka Karibu. Regardless of Kronii’s and Fauna’s differences, a genmate is a genmate and the Council has each other’s backs."
KRO_reintegrate_the_orcats_land:0 "Reintegrate the Orcat's Land"
  KRO_reintegrate_the_orcats_land_desc:0 "The strange, mythological Orcat and her Shrimpies occupy vital territories. More than that, they occupy territories that rightfully belong to Kronii. Peace is not an option."
KRO_usurp_the_former_senpai:0 "Usurp the Former Senpai"
  KRO_usurp_the_former_senpai_desc:0 "Regardless of if she’s a senpai, Mio’s occupation of western Canada and Alaska is problematic. How can we assist Australia if we can’t sail the Pacific? Mio-senpai must be subdued for the sake of the Council."
KRO_canada_reunified:0 "Canada Reunified"
  KRO_canada_reunified_desc:0 "Finally, Kronii’s vision of a united Canada has been realized. The frozen north belongs to the Warden of Time as it always should have. The timeline is stable once more."
