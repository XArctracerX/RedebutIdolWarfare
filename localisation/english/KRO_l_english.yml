#### Events #### 
### Phase One ###
KRO_phase_one.1.t:0 "Ouro Kronii Addresses the Allegations"
KRO_phase_one.1.d:0 "During a public address to Kronies across the country, Ouro Kronii finally spoke on the recent allegations made against her. Feline accessories on her head swayed with the wind as she refuted each and every accusation with ease. With some unprompted and very impressive meowing, she carried on to throw her friend KroMa under the bus by outing her as a furry. Eventually the conference devolved into her meowing with no water breaks. All in all, it seems the Kronies’ superstition has been shut down with perfect precision.\n\n*This article has been bought and paid for by Ouro Kronii."
KRO_phase_one.1.a:0 "She just wanted to meow, didn't she?"

KRO_phase_one.2.t:0 "Ouro Kronii no longer a Subway fan?"
KRO_phase_one.2.d:0 "After an experiment involving the blending of Subway sandwiches, Kronii downed three different concoctions. Not long after, she became seriously ill, the watery, soupy liquid causing a reaction of revulsion. After the attempted sandwich smoothies, she claims that she no longer intends on consuming food from Subway. It seems that she plans on adopting a healthier diet in combination with a gym membership. Kronii’s comeback has inspired many young, aspiring Kronies to live a healthier lifestyle. It’s unknown if she’ll be available to comment on her recent innovations within the food industry, but it’s clear that she’s learned a lot."
KRO_phase_one.2.a:0 "Thank Kronii it’s over..."

KRO_phase_one.3.t:0 "Ouro Kronii almost dies to the One Chip Challenge"
KRO_phase_one.3.d:0 "Kronies across the country were left in shock today after a disturbing livestream meant to promote fearlessness in the army went horribly wrong. Kronii took on a popular internet trend known as the “One Chip Challenge” and was critically injured live on stream. Kronies watched in horror as the chip sent her into a gasping fit, which was followed by vomiting from the Warden. Several Kronies expressed their dissatisfaction at the fact that the livestream would occasionally go silent as if muted. Some argued that this whole stunt was faked as part of the propaganda, but Ouro Kronii swiftly responded with the statement: “HEAR BETTER!” Many are unsure what to think and are wondering if such a dangerous trend was worth it in the end. However, Kronii was able to power through until the effects of the spice wore off, continuing the livestream to calm anxious Kronies."
KRO_phase_one.3.a:0 "Pet play AND masochism?"

KRO_phase_one.4.t:0 "Peace Treaty"
KRO_phase_one.4.d:0 "Fauna is green,\nKronii is blue,\nI won’t be mean,\nIf you’ll be nice too.\n\nPlease accept this peace treaty from me unto you.\n*On the condition that the following demands are met.\n\nDEMAND #1\nMumei’s independence\n\nDEMAND #2\nRights of Piglins\n\nDEMAND #3\nAdequate pay for all current and future Bunkeronii employees\n\nDEMAND #4\nFox welfare\n\nDEMAND #5\nBreak room accommodations\n\nRegards, Fauna, Piglins, and Saplings\nSQUEEB"
KRO_phase_one.4.a:0 "I'll keep this in mind."

KRO_phase_one.5.t:0 "Canada reunifed under Ouro Kronii"
KRO_phase_one.5.d:0 "“Attention, Canada! I am Ouro Kronii, Warden of Time! Mio has surrendered to me. Because of this, I now control the Mio-fam and Hatotaurus! And even Haruka’s cult no longer has the strength to oppose me. If anyone dare oppose me now, they shall know the power of Hatotaurus! Those who can challenge my military rule no longer exist! Yes! From this day, from this moment forward, Canada belongs to me! Ouro Kronii commands you! Obey me, Canada!”"
KRO_phase_one.5.a:0 "All hail Kronii!"

