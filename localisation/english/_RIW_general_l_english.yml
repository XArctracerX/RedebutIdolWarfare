#### Welcome Page ####

 WRD.1.t:0 "Welcome!"
 WRD.1.d:0 "Thank you for downloading and trying out our mod! Currently, we have an introductory focus tree for Empironii with a fully playable conflict in Canada. Please enjoy this little teaser into the world of RIW! Future content will eventually release with various nations shown in the country select screen. You can submit any suggestions or report any bugs in our official Discord, which is linked on the Steam Workshop page. You can also apply to help develop the mod if you think there's something you can help with.\n\nSincerely, the RIW Team: Zippie, Arc, and Rhea."
 WRD.1.a:0 "Thanks!"