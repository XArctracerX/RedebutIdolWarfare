FAUNA_OMEN_DESC:0 "Ceres Fauna was one of the first VTubers to arise in what was once modern China, within the regions of Manchuria. With her level of power and minimal opposition, she quickly occupied the majority of former China, declaring it the first step in healing the Earth. The once highly industrialised nation was quickly torn down and rebuilt with ecological preservation in mind. As the Keeper of Nature, it is her sacred duty to preserve all living things, but there are those who wish to interfere with that duty. "

KRONII_OMEN_DESC:0 "Ever since Ouro Kronii took power in Ontario in late 2025, her newly founded empire has faced a plethora of issues. An immigration crisis from the White Fox Friendom, a scandal behind closed doors and tensions rising with the Forest of Fauna. With Australian Council leadership slowly being snuffed out by the Haachama Order, the future of Ouro Kronii and her nation is uncertain. Nevertheless, she will face the present with maximum efficiency, brutal organization and the daydreams that lead to her ambition. A united Canada bound by the chains of the Warden of Time."

